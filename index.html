
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS AI OS - MARK III</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --neon-cyan: #00f2ff;
        --neon-blue: #0041ff;
        --neon-purple: #7000ff;
        --danger-red: #ff003c;
      }
      body {
        background-color: #01040a;
        color: #e2e8f0;
        font-family: 'Space Grotesk', sans-serif;
        overflow: hidden;
        margin: 0;
      }
      .font-orbitron { font-family: 'Orbitron', sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }

      .glass {
        background: rgba(10, 15, 25, 0.4);
        backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(0, 242, 255, 0.1);
      }
      
      .text-glow { text-shadow: 0 0 10px var(--neon-cyan); }
      .border-glow { box-shadow: 0 0 20px rgba(0, 242, 255, 0.15); }

      /* Neural Grid Background */
      .neural-bg {
        position: fixed;
        inset: 0;
        background-image: 
          radial-gradient(circle at 2px 2px, rgba(0, 242, 255, 0.05) 1px, transparent 0);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: -1;
      }

      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
      .scanline-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(to bottom, transparent 50%, rgba(0, 242, 255, 0.01) 50%);
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 100;
      }

      .vignette {
        display: none !important;
      }

      @keyframes radar-beam {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .radar-animation { animation: radar-beam 5s linear infinite; }
      
      .custom-scroll::-webkit-scrollbar { width: 4px; }
      .custom-scroll::-webkit-scrollbar-track { background: transparent; }
      .custom-scroll::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 10px; }
      
      /* Hexagon Pattern */
      .hex-overlay {
        position: fixed; inset: 0;
        opacity: 0.03;
        background-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iMzAiIHZpZXdCb3g9IjAgMCA2MCAzMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cGF0aCBkPSJNMzAgMEw2MCAxNUwzMCAzMEwwIDE1TDMwIDBaIiBmaWxsPSJub25lIiBzdHJva2U9IiMwMGYyZmYiIHN0cm9rZS13aWR0aD0iMSIvPjwvc3ZnPg==');
        pointer-events: none;
        z-index: -1;
      }

      /* Smooth Slate Grey Theme Overrides */
      [data-theme="slate"] body {
        background-color: #12151c !important;
        color: #f1f5f9;
      }
      [data-theme="slate"] .scanline-overlay,
      [data-theme="slate"] .hex-overlay {
        display: none !important;
      }
      [data-theme="slate"] .neural-bg {
        background-image: radial-gradient(circle at 2px 2px, rgba(255, 255, 255, 0.05) 1px, transparent 0);
      }
      [data-theme="slate"] .custom-scroll::-webkit-scrollbar-thumb {
        background: #475569 !important;
        border-radius: 10px;
      }

      /* Minimalist Executive Glass Theme */
      [data-theme="minimal"] body {
        background-color: #0b0f17 !important;
        color: #f1f5f9;
      }
      [data-theme="minimal"] .scanline-overlay,
      [data-theme="minimal"] .hex-overlay {
        display: none !important;
      }
      [data-theme="minimal"] .neural-bg {
        background-image: radial-gradient(circle at 1px 1px, rgba(16, 185, 129, 0.08) 1px, transparent 0);
        background-size: 32px 32px;
      }
      [data-theme="minimal"] .custom-scroll::-webkit-scrollbar-thumb {
        background: #10b981 !important;
        border-radius: 10px;
      }

      /* Titanium Gold Luxury Theme */
      [data-theme="gold"] body {
        background-color: #12100e !important;
        color: #fdf8f0;
      }
      [data-theme="gold"] .scanline-overlay,
      [data-theme="gold"] .hex-overlay {
        display: none !important;
      }
      [data-theme="gold"] .neural-bg {
        background-image: radial-gradient(circle at 1px 1px, rgba(245, 158, 11, 0.08) 1px, transparent 0);
        background-size: 28px 28px;
      }
      [data-theme="gold"] .custom-scroll::-webkit-scrollbar-thumb {
        background: #f59e0b !important;
        border-radius: 10px;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4"
      }
    }
    </script>
  </head>
  <body>
    <div class="neural-bg"></div>
    <div class="hex-overlay"></div>
    <div class="scanline-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
