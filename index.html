
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS AI OS - MARK III</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --neon-cyan: #00f2ff;
        --neon-blue: #0041ff;
        --neon-purple: #7000ff;
        --danger-red: #ff003c;
      }
      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        text-shadow: none !important;
      }
      body {
        background-color: #01040a;
        color: #e2e8f0;
        font-family: 'Plus Jakarta Sans', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      .font-orbitron { font-family: 'Orbitron', sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      .font-space { font-family: 'Space Grotesk', sans-serif; }
      .font-rajdhani { font-family: 'Rajdhani', sans-serif; }
      .font-modern { font-family: 'Plus Jakarta Sans', sans-serif; }
      .font-exo { font-family: 'Exo 2', sans-serif; }

      /* Dynamic Font Style Overrides across both modes */
      [data-font="space"] body, [data-font="space"] div, [data-font="space"] p, [data-font="space"] span, [data-font="space"] button, [data-font="space"] input, [data-font="space"] select, [data-font="space"] textarea, [data-font="space"] h1, [data-font="space"] h2, [data-font="space"] h3, [data-font="space"] h4 {
        font-family: 'Space Grotesk', sans-serif;
      }
      [data-font="orbitron"] body, [data-font="orbitron"] div, [data-font="orbitron"] p, [data-font="orbitron"] span, [data-font="orbitron"] button, [data-font="orbitron"] input, [data-font="orbitron"] select, [data-font="orbitron"] textarea, [data-font="orbitron"] h1, [data-font="orbitron"] h2, [data-font="orbitron"] h3, [data-font="orbitron"] h4 {
        font-family: 'Orbitron', sans-serif;
      }
      [data-font="rajdhani"] body, [data-font="rajdhani"] div, [data-font="rajdhani"] p, [data-font="rajdhani"] span, [data-font="rajdhani"] button, [data-font="rajdhani"] input, [data-font="rajdhani"] select, [data-font="rajdhani"] textarea, [data-font="rajdhani"] h1, [data-font="rajdhani"] h2, [data-font="rajdhani"] h3, [data-font="rajdhani"] h4 {
        font-family: 'Rajdhani', sans-serif;
      }
      [data-font="mono"] body, [data-font="mono"] div, [data-font="mono"] p, [data-font="mono"] span, [data-font="mono"] button, [data-font="mono"] input, [data-font="mono"] select, [data-font="mono"] textarea, [data-font="mono"] h1, [data-font="mono"] h2, [data-font="mono"] h3, [data-font="mono"] h4 {
        font-family: 'JetBrains Mono', monospace;
      }
      [data-font="modern"] body, [data-font="modern"] div, [data-font="modern"] p, [data-font="modern"] span, [data-font="modern"] button, [data-font="modern"] input, [data-font="modern"] select, [data-font="modern"] textarea, [data-font="modern"] h1, [data-font="modern"] h2, [data-font="modern"] h3, [data-font="modern"] h4 {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      [data-font="exo"] body, [data-font="exo"] div, [data-font="exo"] p, [data-font="exo"] span, [data-font="exo"] button, [data-font="exo"] input, [data-font="exo"] select, [data-font="exo"] textarea, [data-font="exo"] h1, [data-font="exo"] h2, [data-font="exo"] h3, [data-font="exo"] h4 {
        font-family: 'Exo 2', sans-serif;
      }

      .glass {
        background: rgba(10, 15, 25, 0.4);
        backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(0, 242, 255, 0.1);
      }
      
      /* No text glow on words to prevent blurry pixelation on zoom */
      .text-glow { text-shadow: none !important; }
      .border-glow { box-shadow: 0 0 25px rgba(0, 242, 255, 0.18); }

      /* Global ultra-sharp crisp text rendering across all HTML elements */
      h1, h2, h3, h4, h5, h6, p, span, button, a, label, input, textarea, select {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        text-shadow: none !important;
      }

      /* Custom Cinematic HUD Keyframe Animations */
      @keyframes scan {
        0% { top: 0%; opacity: 0.8; }
        50% { opacity: 1; }
        100% { top: 96%; opacity: 0.8; }
      }
      @keyframes heartbeat {
        0%, 100% { transform: scaleX(1); opacity: 0.7; }
        50% { transform: scaleX(1.05); opacity: 1; }
      }
      @keyframes floatDust {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-30px) translateX(15px); opacity: 0.8; }
        100% { transform: translateY(-60px) translateX(-10px); opacity: 0; }
      }
      @keyframes beamPulse {
        0%, 100% { opacity: 0.3; stroke-dashoffset: 0; }
        50% { opacity: 0.9; stroke-dashoffset: -20; }
      }
      @keyframes atmosphericFloat {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes sunRaySpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes rainDropFall {
        0% { transform: translateY(-4px) scaleY(0.8); opacity: 0; }
        40% { opacity: 1; transform: translateY(8px) scaleY(1.1); }
        100% { transform: translateY(18px) scaleY(0.6); opacity: 0; }
      }
      @keyframes lightningFlash {
        0%, 85%, 100% { opacity: 0; }
        88%, 94% { opacity: 1; }
      }

      /* Global Custom Dark Theme Scrollbars - Rule #4 */
      *::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      *::-webkit-scrollbar-track {
        background: rgba(8, 15, 25, 0.9) !important;
        border-radius: 999px;
      }
      *::-webkit-scrollbar-thumb {
        background: #00D8FF !important;
        border-radius: 999px;
        border: none !important;
        box-shadow: 0 0 10px rgba(0, 216, 255, 0.5);
      }
      *::-webkit-scrollbar-thumb:hover {
        background: #2EEBFF !important;
        box-shadow: 0 0 15px rgba(46, 235, 255, 0.8);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #00D8FF rgba(8, 15, 25, 0.9);
      }

      /* Hide scrollbar utility */
      .scrollbar-none::-webkit-scrollbar,
      .no-scrollbar::-webkit-scrollbar,
      .custom-scroll-none::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      .scrollbar-none,
      .no-scrollbar,
      .custom-scroll-none {
        -ms-overflow-style: none !important;
        scrollbar-width: none !important;
      }

      /* Smooth Global Theme Transitions & Theme Specific Styling */
      body, button, div, span, nav, header, aside, section {
        transition: background-color 300ms ease, border-color 300ms ease, box-shadow 300ms ease;
      }

      /* Theme 1: Cyber Neon HUD (Default) */
      [data-theme="cyber"] body {
        background-color: #01040a !important;
        color: #e2e8f0;
      }
      [data-theme="cyber"] *::-webkit-scrollbar-thumb {
        background: #00D8FF !important;
        box-shadow: 0 0 10px rgba(0, 216, 255, 0.5);
      }

      /* Theme 2: Crimson Alert Core (Emergency AI Protocol) */
      [data-theme="crimson"] body {
        background-color: #050002 !important;
        color: #ffe4e6;
      }
      [data-theme="crimson"] *::-webkit-scrollbar-track {
        background: rgba(20, 3, 7, 0.9) !important;
      }
      [data-theme="crimson"] *::-webkit-scrollbar-thumb {
        background: #ff003c !important;
        box-shadow: 0 0 12px rgba(255, 0, 60, 0.6);
      }
      [data-theme="crimson"] ::selection {
        background: #9f1239;
        color: #ffffff;
      }

      /* Theme 3: Quantum Violet (Artificial Super Intelligence) */
      [data-theme="violet"] body {
        background-color: #050414 !important;
        color: #f3e8ff;
      }
      [data-theme="violet"] *::-webkit-scrollbar-track {
        background: rgba(15, 9, 36, 0.9) !important;
      }
      [data-theme="violet"] *::-webkit-scrollbar-thumb {
        background: #a855f7 !important;
        box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
      }
      [data-theme="violet"] ::selection {
        background: #6b21a8;
        color: #ffffff;
      }

      /* Theme 4: Emerald Sentinel (Military AI & Satellite Defense) */
      [data-theme="emerald"] body {
        background-color: #020b08 !important;
        color: #ecfdf5;
      }
      [data-theme="emerald"] *::-webkit-scrollbar-track {
        background: rgba(5, 26, 18, 0.9) !important;
      }
      [data-theme="emerald"] *::-webkit-scrollbar-thumb {
        background: #10b981 !important;
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
      }
      [data-theme="emerald"] ::selection {
        background: #065f46;
        color: #ffffff;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
