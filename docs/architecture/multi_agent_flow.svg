<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" style="background-color: #030712; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>

    <linearGradient id="master-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="agent-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- Title -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" font-size="24" font-weight="900" fill="#38bdf8" letter-spacing="2">JARVIS MULTI-AGENT SWARM &amp; KNOWLEDGE GRAPH TOPOLOGY</text>
    <text x="0" y="22" font-size="13" font-weight="600" fill="#94a3b8">DELEGATED TASK SWARM AND SEMANTIC KNOWLEDGE PERSISTENCE</text>
  </g>

  <!-- MASTER AGENT (Center Top) -->
  <g transform="translate(650, 110)">
    <rect width="300" height="90" rx="18" fill="#0f172a" stroke="url(#master-grad)" stroke-width="3"/>
    <text x="150" y="38" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle">🎯 MASTER AGENT</text>
    <text x="150" y="60" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Orchestrates, Synthesizes &amp; Delegates Tasks</text>
  </g>

  <!-- SWARM AGENTS GRID (Middle Row) -->
  <g transform="translate(60, 260)">
    <!-- Research Agent -->
    <g transform="translate(0, 0)">
      <rect width="220" height="110" rx="14" fill="url(#agent-grad)" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="20" y="30" font-size="13" font-weight="800" fill="#38bdf8">🔍 Research Agent</text>
      <text x="20" y="52" font-size="10" fill="#94a3b8">Web search, paper scraping,</text>
      <text x="20" y="68" font-size="10" fill="#94a3b8">fact extraction &amp; summary.</text>
    </g>

    <!-- Coding Agent -->
    <g transform="translate(250, 0)">
      <rect width="220" height="110" rx="14" fill="url(#agent-grad)" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="20" y="30" font-size="13" font-weight="800" fill="#38bdf8">💻 Coding Agent</text>
      <text x="20" y="52" font-size="10" fill="#94a3b8">TypeScript, Python, Shell,</text>
      <text x="20" y="68" font-size="10" fill="#94a3b8">AST edits &amp; refactoring.</text>
    </g>

    <!-- Debug Agent -->
    <g transform="translate(500, 0)">
      <rect width="220" height="110" rx="14" fill="url(#agent-grad)" stroke="#a855f7" stroke-width="1.2"/>
      <text x="20" y="30" font-size="13" font-weight="800" fill="#c084fc">🐛 Debug Agent</text>
      <text x="20" y="52" font-size="10" fill="#94a3b8">Error trace analysis, stack</text>
      <text x="20" y="68" font-size="10" fill="#94a3b8">unwinding &amp; auto-patching.</text>
    </g>

    <!-- Browser Agent -->
    <g transform="translate(750, 0)">
      <rect width="220" height="110" rx="14" fill="url(#agent-grad)" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="20" y="30" font-size="13" font-weight="800" fill="#38bdf8">🌐 Browser Agent</text>
      <text x="20" y="52" font-size="10" fill="#94a3b8">DOM navigation, form fill,</text>
      <text x="20" y="68" font-size="10" fill="#94a3b8">web scraping &amp; Playwright.</text>
    </g>

    <!-- Reasoning Agent -->
    <g transform="translate(1000, 0)">
      <rect width="220" height="110" rx="14" fill="url(#agent-grad)" stroke="#a855f7" stroke-width="1.2"/>
      <text x="20" y="30" font-size="13" font-weight="800" fill="#c084fc">🧠 Reasoning Agent</text>
      <text x="20" y="52" font-size="10" fill="#94a3b8">Deep logic, chain-of-thought</text>
      <text x="20" y="68" font-size="10" fill="#94a3b8">&amp; complex proof generation.</text>
    </g>

    <!-- UI / GUI Agent -->
    <g transform="translate(1250, 0)">
      <rect width="230" height="110" rx="14" fill="url(#agent-grad)" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="20" y="30" font-size="13" font-weight="800" fill="#38bdf8">🎛️ UI/GUI Agent</text>
      <text x="20" y="52" font-size="10" fill="#94a3b8">jarvis_gui_control layout,</text>
      <text x="20" y="68" font-size="10" fill="#94a3b8">theme &amp; workspace autonomy.</text>
    </g>
  </g>

  <!-- Connecting Lines from Master to Swarm -->
  <path d="M 750,200 L 170,260" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <path d="M 770,200 L 360,260" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <path d="M 800,200 L 610,260" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <path d="M 800,200 L 860,260" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <path d="M 830,200 L 1110,260" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <path d="M 850,200 L 1360,260" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- KNOWLEDGE GRAPH MEMORY (Bottom Half) -->
  <g transform="translate(60, 430)">
    <rect width="1480" height="520" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="30" y="40" font-size="16" font-weight="900" fill="#38bdf8" letter-spacing="1">🕸️ SEMANTIC KNOWLEDGE GRAPH &amp; VECTOR VAULT</text>

    <!-- Graph Nodes -->
    <!-- Node 1: Operator User Entity -->
    <g transform="translate(680, 80)">
      <circle cx="60" cy="60" r="50" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
      <text x="60" y="58" font-size="12" font-weight="900" fill="#f8fafc" text-anchor="middle">OPERATOR</text>
      <text x="60" y="74" font-size="9" font-weight="600" fill="#38bdf8" text-anchor="middle">User Root Node</text>
    </g>

    <!-- Node 2: Projects -->
    <g transform="translate(200, 180)">
      <circle cx="50" cy="50" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <text x="50" y="48" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">PROJECTS</text>
      <text x="50" y="62" font-size="9" fill="#94a3b8" text-anchor="middle">Codebases</text>
    </g>

    <!-- Node 3: Preferences -->
    <g transform="translate(1160, 180)">
      <circle cx="50" cy="50" r="45" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
      <text x="50" y="48" font-size="11" font-weight="800" fill="#c084fc" text-anchor="middle">PREFERENCES</text>
      <text x="50" y="62" font-size="9" fill="#94a3b8" text-anchor="middle">Themes/Voice/Tone</text>
    </g>

    <!-- Node 4: Conversations -->
    <g transform="translate(420, 320)">
      <circle cx="50" cy="50" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <text x="50" y="48" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">HISTORY</text>
      <text x="50" y="62" font-size="9" fill="#94a3b8" text-anchor="middle">Vector Embeddings</text>
    </g>

    <!-- Node 5: Goals & Tasks -->
    <g transform="translate(940, 320)">
      <circle cx="50" cy="50" r="45" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
      <text x="50" y="48" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">GOALS</text>
      <text x="50" y="62" font-size="9" fill="#94a3b8" text-anchor="middle">Active Workflows</text>
    </g>

    <!-- Node 6: Files & Code Assets -->
    <g transform="translate(100, 380)">
      <rect x="0" y="0" width="140" height="60" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="70" y="28" font-size="11" font-weight="800" fill="#f8fafc" text-anchor="middle">FILES &amp; ASSETS</text>
      <text x="70" y="44" font-size="9" fill="#94a3b8" text-anchor="middle">AST &amp; Indexes</text>
    </g>

    <!-- Edges -->
    <line x1="700" y1="180" x2="290" y2="220" stroke="#38bdf8" stroke-width="2"/>
    <text x="500" y="190" font-size="10" fill="#94a3b8">owns &amp; edits</text>

    <line x1="780" y1="180" x2="1170" y2="220" stroke="#a855f7" stroke-width="2"/>
    <text x="960" y="190" font-size="10" fill="#c084fc">prefers &amp; configures</text>

    <line x1="710" y1="190" x2="490" y2="330" stroke="#38bdf8" stroke-width="2"/>
    <text x="580" y="270" font-size="10" fill="#94a3b8">converses in</text>

    <line x1="760" y1="190" x2="960" y2="330" stroke="#34d399" stroke-width="2"/>
    <text x="880" y="270" font-size="10" fill="#34d399">targets &amp; executes</text>

    <line x1="240" y1="270" x2="180" y2="380" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>
</svg>
