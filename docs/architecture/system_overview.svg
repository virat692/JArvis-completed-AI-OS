<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="100%" height="100%" style="background-color: #030712; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b1528"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    
    <linearGradient id="kernel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    
    <linearGradient id="bus-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#06b6d4" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1100" fill="url(#bg-glow)"/>
  
  <!-- Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <path d="M 0,100 L 1600,100 M 0,200 L 1600,200 M 0,300 L 1600,300 M 0,400 L 1600,400 M 0,500 L 1600,500 M 0,600 L 1600,600 M 0,700 L 1600,700 M 0,800 L 1600,800 M 0,900 L 1600,900 M 0,1000 L 1600,1000" />
    <path d="M 100,0 L 100,1100 M 200,0 L 200,1100 M 300,0 L 300,1100 M 400,0 L 400,1100 M 500,0 L 500,1100 M 600,0 L 600,1100 M 700,0 L 700,1100 M 800,0 L 800,1100 M 900,0 L 900,1100 M 1000,0 L 1000,1100 M 1100,0 L 1100,1100 M 1200,0 L 1200,1100 M 1300,0 L 1300,1100 M 1400,0 L 1400,1100 M 1500,0 L 1500,1100" />
  </g>

  <!-- Header -->
  <g transform="translate(60, 50)">
    <text x="0" y="0" font-size="28" font-weight="900" fill="#38bdf8" letter-spacing="2">JARVIS AI OPERATING SYSTEM</text>
    <text x="0" y="24" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="1">MASTER SYSTEM ARCHITECTURE & TOPOLOGY BLUEPRINT</text>
  </g>

  <!-- 1. USER INTERFACE LAYER (Top) -->
  <g transform="translate(60, 110)">
    <rect width="1480" height="90" rx="16" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="30" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="1.5">USER INTERFACE & INGRESS LAYER</text>
    
    <g transform="translate(20, 42)">
      <!-- Voice Input -->
      <rect x="0" y="0" width="220" height="36" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
      <text x="110" y="22" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">🎙️ Neural Voice / Speech STT</text>
      
      <!-- User GUI HUD -->
      <rect x="240" y="0" width="250" height="36" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
      <text x="365" y="22" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">🖥️ Cinematic HUD (Voice Mode)</text>

      <!-- Developer Console -->
      <rect x="510" y="0" width="250" height="36" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
      <text x="635" y="22" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">💻 JARVIS System Console</text>

      <!-- CLI / OS Bridge -->
      <rect x="780" y="0" width="220" height="36" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
      <text x="890" y="22" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">⌨️ CLI &amp; Terminal Bridge</text>

      <!-- Optic Vision -->
      <rect x="1020" y="0" width="210" height="36" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
      <text x="1125" y="22" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">👁️ Optic Vision Camera</text>

      <!-- Screen Perception -->
      <rect x="1245" y="0" width="210" height="36" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
      <text x="1350" y="22" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">🖼️ Screen OCR &amp; Inspector</text>
    </g>
  </g>

  <!-- Connection: UI Layer to Event Bus -->
  <path d="M 800,200 L 800,240" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>

  <!-- 2. HIGH SPEED EVENT BUS (Layer 2) -->
  <g transform="translate(60, 240)">
    <rect width="1480" height="50" rx="12" fill="#0f172a" stroke="url(#bus-grad)" stroke-width="3" filter="url(#glow-cyan)" />
    <text x="740" y="30" font-size="14" font-weight="900" fill="#f8fafc" letter-spacing="2" text-anchor="middle">⚡ HIGH-SPEED SYSTEM EVENT BUS (ASYNCHRONOUS EVENT ROUTER)</text>
  </g>

  <!-- Connection: Event Bus to Kernel -->
  <path d="M 800,290 L 800,330" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- 3. JARVIS KERNEL & RUNTIME CORE (Layer 3) -->
  <g transform="translate(60, 330)">
    <rect width="1480" height="230" rx="20" fill="url(#kernel-grad)" stroke="#38bdf8" stroke-width="2" />
    <text x="25" y="32" font-size="14" font-weight="900" fill="#38bdf8" letter-spacing="1.5">🛡️ JARVIS KERNEL &amp; CONTINUOUS RUNTIME ENGINE</text>

    <!-- Kernel Core Modules Grid -->
    <g transform="translate(25, 50)">
      <!-- System Heartbeat -->
      <rect x="0" y="0" width="220" height="70" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
      <text x="15" y="25" font-size="12" font-weight="800" fill="#38bdf8">💓 Heartbeat &amp; Loop</text>
      <text x="15" y="45" font-size="10" fill="#94a3b8">24/7 Tick, Liveness, Autonomous Guard</text>

      <!-- Task Scheduler -->
      <rect x="240" y="0" width="220" height="70" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
      <text x="255" y="25" font-size="12" font-weight="800" fill="#38bdf8">📅 Priority Task Scheduler</text>
      <text x="255" y="45" font-size="10" fill="#94a3b8">Cron, Timers, Task Queue Manager</text>

      <!-- Authority & Security -->
      <rect x="480" y="0" width="240" height="70" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
      <text x="495" y="25" font-size="12" font-weight="800" fill="#c084fc">🔒 Security &amp; Risk Guard</text>
      <text x="495" y="45" font-size="10" fill="#94a3b8">Permission Validator &amp; Audit Log</text>

      <!-- Telemetry & Health -->
      <rect x="740" y="0" width="220" height="70" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
      <text x="755" y="25" font-size="12" font-weight="800" fill="#38bdf8">📊 Telemetry &amp; Recovery</text>
      <text x="755" y="45" font-size="10" fill="#94a3b8">CPU/RAM, Self-healing, Fault Recovery</text>

      <!-- Plugin Loader -->
      <rect x="980" y="0" width="220" height="70" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
      <text x="995" y="25" font-size="12" font-weight="800" fill="#38bdf8">🔌 Plugin Engine Manager</text>
      <text x="995" y="45" font-size="10" fill="#94a3b8">Hot-swap Extensions &amp; Integrations</text>

      <!-- GUI Autonomy Governor -->
      <rect x="1220" y="0" width="210" height="70" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="1235" y="25" font-size="12" font-weight="800" fill="#38bdf8">🎛️ GUI Autonomy Manager</text>
      <text x="1235" y="45" font-size="10" fill="#94a3b8">jarvis_gui_control Execution</text>

      <!-- Second Row in Kernel -->
      <g transform="translate(0, 85)">
        <rect x="0" y="0" width="340" height="70" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="1"/>
        <text x="15" y="25" font-size="12" font-weight="800" fill="#f8fafc">🧠 Intent Detection &amp; Router</text>
        <text x="15" y="45" font-size="10" fill="#94a3b8">Synthesizes User Intent &amp; Routes to Providers</text>

        <rect x="360" y="0" width="360" height="70" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="1"/>
        <text x="375" y="25" font-size="12" font-weight="800" fill="#f8fafc">⚙️ Tool Execution Engine</text>
        <text x="375" y="45" font-size="10" fill="#94a3b8">Executes Shell, OS Bridge, Web Search, &amp; APIs</text>

        <rect x="740" y="0" width="350" height="70" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="1"/>
        <text x="755" y="25" font-size="12" font-weight="800" fill="#f8fafc">📋 Autonomous Workflow Engine</text>
        <text x="755" y="45" font-size="10" fill="#94a3b8">Multi-step Task Chains &amp; Verification</text>

        <rect x="1110" y="0" width="320" height="70" rx="10" fill="#020617" stroke="#a855f7" stroke-width="1"/>
        <text x="1125" y="25" font-size="12" font-weight="800" fill="#c084fc">🗣️ Charon TTS Voice Synthesizer</text>
        <text x="1125" y="45" font-size="10" fill="#94a3b8">Deep Neural Vocalizer &amp; Sound FX</text>
      </g>
    </g>
  </g>

  <!-- Connectors from Kernel down to Subsystems -->
  <path d="M 300,560 L 300,610" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <path d="M 650,560 L 650,610" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M 1000,560 L 1000,610" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <path d="M 1350,560 L 1350,610" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- 4. SUBSYSTEMS LAYER (Layer 4) -->
  <g transform="translate(60, 610)">
    
    <!-- AI Provider Manager -->
    <g transform="translate(0, 0)">
      <rect width="340" height="240" rx="16" fill="url(#card-grad)" stroke="#06b6d4" stroke-width="1.5" />
      <text x="20" y="30" font-size="13" font-weight="900" fill="#38bdf8">🤖 AI PROVIDER ROUTER</text>
      
      <rect x="15" y="45" width="310" height="28" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="0.8"/>
      <text x="25" y="63" font-size="11" font-weight="700" fill="#e2e8f0">Gemini 3.6 Flash / Pro (Default)</text>
      
      <rect x="15" y="80" width="310" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
      <text x="25" y="98" font-size="11" font-weight="600" fill="#94a3b8">NVIDIA Nemotron Ultra 70B</text>

      <rect x="15" y="115" width="310" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
      <text x="25" y="133" font-size="11" font-weight="600" fill="#94a3b8">OpenAI GPT-4o / O1 Reasoning</text>

      <rect x="15" y="150" width="310" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
      <text x="25" y="168" font-size="11" font-weight="600" fill="#94a3b8">Anthropic Claude 3.5 Sonnet</text>

      <rect x="15" y="185" width="310" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
      <text x="25" y="203" font-size="11" font-weight="600" fill="#94a3b8">DeepSeek R1 &amp; Local Ollama</text>
    </g>

    <!-- Multi-Agent Swarm -->
    <g transform="translate(360, 0)">
      <rect width="350" height="240" rx="16" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.5" />
      <text x="20" y="30" font-size="13" font-weight="900" fill="#c084fc">🐝 MULTI-AGENT SWARM</text>

      <g transform="translate(15, 45)">
        <rect x="0" y="0" width="150" height="32" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="0.8"/>
        <text x="10" y="20" font-size="10" font-weight="700" fill="#e2e8f0">🎯 Master Agent</text>

        <rect x="160" y="0" width="160" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
        <text x="170" y="20" font-size="10" font-weight="600" fill="#cbd5e1">🔎 Research Agent</text>

        <rect x="0" y="40" width="150" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
        <text x="10" y="60" font-size="10" font-weight="600" fill="#cbd5e1">💻 Coding Agent</text>

        <rect x="160" y="40" width="160" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
        <text x="170" y="60" font-size="10" font-weight="600" fill="#cbd5e1">🐛 Debug Agent</text>

        <rect x="0" y="80" width="150" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
        <text x="10" y="100" font-size="10" font-weight="600" fill="#cbd5e1">🌐 Browser Agent</text>

        <rect x="160" y="80" width="160" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
        <text x="170" y="100" font-size="10" font-weight="600" fill="#cbd5e1">📐 Planner Agent</text>

        <rect x="0" y="120" width="150" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
        <text x="10" y="140" font-size="10" font-weight="600" fill="#cbd5e1">🧠 Memory Agent</text>

        <rect x="160" y="120" width="160" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
        <text x="170" y="140" font-size="10" font-weight="600" fill="#cbd5e1">🎛️ UI/GUI Agent</text>
      </g>
    </g>

    <!-- Knowledge Graph Memory System -->
    <g transform="translate(730, 0)">
      <rect width="360" height="240" rx="16" fill="url(#card-grad)" stroke="#06b6d4" stroke-width="1.5" />
      <text x="20" y="30" font-size="13" font-weight="900" fill="#38bdf8">🧠 MEMORY &amp; KNOWLEDGE GRAPH</text>

      <g transform="translate(15, 45)">
        <rect x="0" y="0" width="330" height="36" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="0.8"/>
        <text x="15" y="22" font-size="11" font-weight="700" fill="#e2e8f0">⚡ Short-term Memory (Working Context)</text>

        <rect x="0" y="45" width="330" height="36" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="0.8"/>
        <text x="15" y="67" font-size="11" font-weight="700" fill="#e2e8f0">📚 Long-term Semantic Vector Store</text>

        <rect x="0" y="90" width="330" height="36" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="0.8"/>
        <text x="15" y="112" font-size="11" font-weight="700" fill="#e2e8f0">🕸️ Knowledge Graph (Entity Relationships)</text>

        <rect x="0" y="135" width="330" height="36" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="0.8"/>
        <text x="15" y="157" font-size="11" font-weight="700" fill="#e2e8f0">💾 User Preferences &amp; System Fact Vault</text>
      </g>
    </g>

    <!-- OS Control & Desktop Engine -->
    <g transform="translate(1110, 0)">
      <rect width="370" height="240" rx="16" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.5" />
      <text x="20" y="30" font-size="13" font-weight="900" fill="#c084fc">🖥️ DESKTOP &amp; OS CONTROLLER</text>

      <g transform="translate(15, 45)">
        <rect x="0" y="0" width="165" height="40" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="24" font-size="11" font-weight="700" fill="#e2e8f0">🐍 Python OS Bridge</text>

        <rect x="175" y="0" width="165" height="40" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="185" y="24" font-size="11" font-weight="700" fill="#e2e8f0">🖱️ Mouse/Keyboard</text>

        <rect x="0" y="50" width="165" height="40" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="74" font-size="11" font-weight="700" fill="#e2e8f0">💻 App Controller</text>

        <rect x="175" y="50" width="165" height="40" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="185" y="74" font-size="11" font-weight="700" fill="#e2e8f0">📁 Filesystem Engine</text>

        <rect x="0" y="100" width="340" height="40" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
        <text x="10" y="124" font-size="11" font-weight="700" fill="#c084fc">🌐 Browser Engine (Playwright / Puppeteer)</text>
      </g>
    </g>
  </g>

  <!-- 5. EXTERNAL INTEGRATION & PLUGINS (Bottom) -->
  <g transform="translate(60, 880)">
    <rect width="1480" height="150" rx="16" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="25" y="30" font-size="13" font-weight="900" fill="#38bdf8" letter-spacing="1">🔌 EXTENSIONS, PLUGINS &amp; EXTERNAL INTEGRATIONS</text>

    <g transform="translate(25, 45)">
      <rect x="0" y="0" width="220" height="75" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
      <text x="15" y="25" font-size="12" font-weight="800" fill="#f8fafc">💻 VS Code Plugin</text>
      <text x="15" y="45" font-size="10" fill="#94a3b8">Code Editor IDE Integration</text>

      <rect x="240" y="0" width="220" height="75" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
      <text x="255" y="25" font-size="12" font-weight="800" fill="#f8fafc">📱 Telegram Bot</text>
      <text x="255" y="45" font-size="10" fill="#94a3b8">Remote Messaging &amp; Alerts</text>

      <rect x="480" y="0" width="220" height="75" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
      <text x="495" y="25" font-size="12" font-weight="800" fill="#f8fafc">🎮 Discord Plugin</text>
      <text x="495" y="45" font-size="10" fill="#94a3b8">Community &amp; Voice Channel</text>

      <rect x="720" y="0" width="220" height="75" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
      <text x="735" y="25" font-size="12" font-weight="800" fill="#f8fafc">🌐 Web Browser Plugin</text>
      <text x="735" y="45" font-size="10" fill="#94a3b8">Chrome/Firefox Automation</text>

      <rect x="960" y="0" width="220" height="75" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
      <text x="975" y="25" font-size="12" font-weight="800" fill="#f8fafc">🤖 Android App Sync</text>
      <text x="975" y="45" font-size="10" fill="#94a3b8">Mobile Companion Integration</text>

      <rect x="1200" y="0" width="230" height="75" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
      <text x="1215" y="25" font-size="12" font-weight="800" fill="#c084fc">⛅ Cloud &amp; REST APIs</text>
      <text x="1215" y="45" font-size="10" fill="#94a3b8">Google Workspace, Weather, Custom</text>
    </g>
  </g>

  <!-- Connectors from Subsystems to Plugins -->
  <path d="M 800,850 L 800,880" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Footer Info -->
  <text x="800" y="1070" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">OFFICIAL ARCHITECTURAL SPECIFICATION SPEC-v4.2 • JARVIS AI OPERATING SYSTEM • ALL RIGHTS RESERVED</text>
</svg>
