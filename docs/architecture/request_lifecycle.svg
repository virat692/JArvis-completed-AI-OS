<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" style="background-color: #030712; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>

    <filter id="glow-line" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- Title -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" font-size="24" font-weight="900" fill="#38bdf8" letter-spacing="2">JARVIS COMPLETE REQUEST LIFECYCLE SEQUENCE</text>
    <text x="0" y="22" font-size="13" font-weight="600" fill="#94a3b8">END-TO-END EVENT FLOW FROM USER INGRESS TO TOOL EXECUTION &amp; VOICE FEEDBACK</text>
  </g>

  <!-- Lifeline Columns -->
  <!-- 1. Operator (X=140) -->
  <!-- 2. Voice/GUI Ingress (X=340) -->
  <!-- 3. JARVIS Kernel (X=560) -->
  <!-- 4. Reasoning & Planner (X=780) -->
  <!-- 5. Authority Engine (X=1000) -->
  <!-- 6. Tool Executor (X=1220) -->
  <!-- 7. Memory & HUD (X=1440) -->

  <!-- Lifeline Headers -->
  <g transform="translate(0, 100)">
    <!-- Column 1 -->
    <rect x="50" y="0" width="180" height="40" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="140" y="25" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">👤 OPERATOR</text>
    <line x1="140" y1="40" x2="140" y2="820" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>

    <!-- Column 2 -->
    <rect x="250" y="0" width="180" height="40" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="340" y="25" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">🎙️ INGRESS (STT / GUI)</text>
    <line x1="340" y1="40" x2="340" y2="820" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>

    <!-- Column 3 -->
    <rect x="470" y="0" width="180" height="40" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="560" y="25" font-size="12" font-weight="800" fill="#c084fc" text-anchor="middle">🛡️ KERNEL ENGINE</text>
    <line x1="560" y1="40" x2="560" y2="820" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6,6"/>

    <!-- Column 4 -->
    <rect x="690" y="0" width="180" height="40" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="780" y="25" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">🧠 AI REASONING</text>
    <line x1="780" y1="40" x2="780" y2="820" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>

    <!-- Column 5 -->
    <rect x="910" y="0" width="180" height="40" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="1000" y="25" font-size="12" font-weight="800" fill="#fb7185" text-anchor="middle">🔒 AUTHORITY &amp; RISK</text>
    <line x1="1000" y1="40" x2="1000" y2="820" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>

    <!-- Column 6 -->
    <rect x="1130" y="0" width="180" height="40" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="1220" y="25" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle">⚙️ TOOL EXECUTOR</text>
    <line x1="1220" y1="40" x2="1220" y2="820" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>

    <!-- Column 7 -->
    <rect x="1350" y="0" width="180" height="40" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="1440" y="25" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">💾 MEMORY &amp; HUD</text>
    <line x1="1440" y1="40" x2="1440" y2="820" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>
  </g>

  <!-- Sequence Steps -->
  <g transform="translate(0, 170)">
    
    <!-- Step 1: Voice / Speech Input -->
    <path d="M 140,20 L 340,20" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" filter="url(#glow-line)"/>
    <rect x="160" y="2" width="160" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.5"/>
    <text x="240" y="15" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">1. Wake Word / Audio Stream</text>

    <!-- Step 2: Event Dispatched to Kernel -->
    <path d="M 340,60 L 560,60" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="360" y="42" width="180" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.5"/>
    <text x="450" y="55" font-size="10" font-weight="700" fill="#e2e8f0" text-anchor="middle">2. Emit Event: user.input.speech</text>

    <!-- Step 3: Context & Memory Retrieval -->
    <path d="M 560,100 L 1440,100" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <rect x="900" y="82" width="200" height="18" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="0.5"/>
    <text x="1000" y="95" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle">3. Fetch Vector &amp; Graph Context</text>

    <!-- Step 4: Context Return -->
    <path d="M 1440,130 L 560,130" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-purple)"/>
    <text x="1000" y="125" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">4. Semantic History &amp; User Facts</text>

    <!-- Step 5: Route to AI Provider & Reasoning -->
    <path d="M 560,170 L 780,170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="580" y="152" width="180" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.5"/>
    <text x="670" y="165" font-size="10" font-weight="700" fill="#e2e8f0" text-anchor="middle">5. Intent &amp; Tool Call Plan</text>

    <!-- Step 6: Tool Plan Returned -->
    <path d="M 780,210 L 560,210" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <text x="670" y="205" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">6. Selected Tool: shell_command</text>

    <!-- Step 7: Security Check -->
    <path d="M 560,250 L 1000,250" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="730" y="232" width="190" height="18" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="0.5"/>
    <text x="825" y="245" font-size="10" font-weight="700" fill="#fb7185" text-anchor="middle">7. Validate Authority &amp; Risk Level</text>

    <!-- Step 8: Security Clearance Granted -->
    <path d="M 1000,280 L 560,280" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
    <text x="780" y="275" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">8. Security Clearance Granted (Low Risk)</text>

    <!-- Step 9: Execute Tool -->
    <path d="M 560,320 L 1220,320" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
    <rect x="830" y="302" width="180" height="18" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="0.5"/>
    <text x="920" y="315" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">9. Execute OS Tool / Python Bridge</text>

    <!-- Step 10: Execution Result -->
    <path d="M 1220,360 L 560,360" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
    <text x="890" y="355" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">10. Execution Output Returned</text>

    <!-- Step 11: Update Memory -->
    <path d="M 560,400 L 1440,400" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <rect x="940" y="382" width="180" height="18" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="0.5"/>
    <text x="1030" y="395" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle">11. Store Interaction in Graph</text>

    <!-- Step 12: Synthesize Response Voice & GUI -->
    <path d="M 560,440 L 340,440" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="380" y="422" width="150" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.5"/>
    <text x="455" y="435" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">12. Render Charon TTS &amp; HUD</text>

    <!-- Step 13: Final Feedback to Operator -->
    <path d="M 340,480 L 140,480" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)" filter="url(#glow-line)"/>
    <rect x="170" y="462" width="140" height="18" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="0.5"/>
    <text x="240" y="475" font-size="10" font-weight="800" fill="#34d399" text-anchor="middle">13. Audio Output &amp; HUD Render</text>
  </g>

  <!-- Bottom Summary Note -->
  <rect x="60" y="880" width="1480" height="60" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="800" y="915" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">⚡ COMPLETE ASYNCHRONOUS PIPELINE COMPLETED IN &lt;250ms (LOCAL REASONING) OR ~800ms (CLOUD GEMINI MULTI-MODAL REASONING)</text>
</svg>
