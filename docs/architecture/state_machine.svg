<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" style="background-color: #030712; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c084fc" />
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- Title -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" font-size="24" font-weight="900" fill="#38bdf8" letter-spacing="2">JARVIS RUNTIME STATE MACHINE &amp; LIFECYCLE</text>
    <text x="0" y="22" font-size="13" font-weight="600" fill="#94a3b8">TRANSITIONS BETWEEN BOOT, LISTENING, REASONING, EXECUTING, &amp; TOKEN-SAVER SLEEP STATES</text>
  </g>

  <!-- STATE NODES -->
  <!-- 1. BOOT / INITIALIZING (Top Left) -->
  <g transform="translate(100, 150)">
    <rect width="260" height="120" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="35" font-size="14" font-weight="900" fill="#38bdf8">1. BOOT_INITIALIZING</text>
    <text x="20" y="60" font-size="10" fill="#94a3b8">• Load Kernel &amp; Modules</text>
    <text x="20" y="76" font-size="10" fill="#94a3b8">• Initialize Sound Synth &amp; STT</text>
    <text x="20" y="92" font-size="10" fill="#94a3b8">• Verify Hardware &amp; Permissions</text>
  </g>

  <!-- 2. IDLE_MONITORING (Center Left) -->
  <g transform="translate(500, 150)">
    <rect width="280" height="120" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="35" font-size="14" font-weight="900" fill="#38bdf8">2. IDLE_MONITORING</text>
    <text x="20" y="60" font-size="10" fill="#94a3b8">• 24/7 Continuous Loop Active</text>
    <text x="20" y="76" font-size="10" fill="#94a3b8">• Listening for Wake Word / Audio</text>
    <text x="20" y="92" font-size="10" fill="#94a3b8">• Optic Vision &amp; HUD Active</text>
  </g>

  <!-- 3. INGRESS_PROCESSING (Center Top) -->
  <g transform="translate(950, 150)">
    <rect width="280" height="120" rx="16" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text x="20" y="35" font-size="14" font-weight="900" fill="#c084fc">3. INGRESS_PROCESSING</text>
    <text x="20" y="60" font-size="10" fill="#94a3b8">• Speech-to-Text Transcription</text>
    <text x="20" y="76" font-size="10" fill="#94a3b8">• Multimodal Screen/Optic Snapshot</text>
    <text x="20" y="92" font-size="10" fill="#94a3b8">• Emit user.input Event</text>
  </g>

  <!-- 4. REASONING_PLANNING (Center Right) -->
  <g transform="translate(950, 420)">
    <rect width="280" height="120" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="35" font-size="14" font-weight="900" fill="#38bdf8">4. REASONING_PLANNING</text>
    <text x="20" y="60" font-size="10" fill="#94a3b8">• Retrieve Memory Context</text>
    <text x="20" y="76" font-size="10" fill="#94a3b8">• Query Provider (Gemini/Local)</text>
    <text x="20" y="92" font-size="10" fill="#94a3b8">• Construct Multi-step Tool Plan</text>
  </g>

  <!-- 5. SECURITY_AUTHORIZATION (Middle Center) -->
  <g transform="translate(500, 420)">
    <rect width="280" height="120" rx="16" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <text x="20" y="35" font-size="14" font-weight="900" fill="#fb7185">5. SECURITY_VALIDATION</text>
    <text x="20" y="60" font-size="10" fill="#94a3b8">• Validate Authority Level</text>
    <text x="20" y="76" font-size="10" fill="#94a3b8">• Risk Score Check (Low/High)</text>
    <text x="20" y="92" font-size="10" fill="#94a3b8">• Confirm or Auto-Clear</text>
  </g>

  <!-- 6. TOOL_EXECUTION (Bottom Right) -->
  <g transform="translate(950, 690)">
    <rect width="280" height="120" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="20" y="35" font-size="14" font-weight="900" fill="#34d399">6. TOOL_EXECUTION</text>
    <text x="20" y="60" font-size="10" fill="#94a3b8">• Execute Shell / Python Bridge</text>
    <text x="20" y="76" font-size="10" fill="#94a3b8">• Control Desktop / Browser / GUI</text>
    <text x="20" y="92" font-size="10" fill="#94a3b8">• Capture Execution Result</text>
  </g>

  <!-- 7. SYNTHESIS_FEEDBACK (Bottom Left) -->
  <g transform="translate(500, 690)">
    <rect width="280" height="120" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="35" font-size="14" font-weight="900" fill="#38bdf8">7. SYNTHESIS_RESPONSE</text>
    <text x="20" y="60" font-size="10" fill="#94a3b8">• Charon Neural Voice Output</text>
    <text x="20" y="76" font-size="10" fill="#94a3b8">• Update HUD Animations &amp; Logs</text>
    <text x="20" y="92" font-size="10" fill="#94a3b8">• Persist to Knowledge Graph</text>
  </g>

  <!-- 8. TOKEN_SAVER_SLEEP (Bottom Far Left) -->
  <g transform="translate(100, 420)">
    <rect width="260" height="120" rx="16" fill="#0f172a" stroke="#eab308" stroke-width="2"/>
    <text x="20" y="35" font-size="14" font-weight="900" fill="#fde047">8. SLEEP_GUARD_SAVER</text>
    <text x="20" y="60" font-size="10" fill="#94a3b8">• Triggered on Idle &gt; 120s</text>
    <text x="20" y="76" font-size="10" fill="#94a3b8">• Pause Camera Vision &amp; OCR</text>
    <text x="20" y="92" font-size="10" fill="#94a3b8">• Zero API Token Wasted</text>
  </g>

  <!-- TRANSITION ARROWS -->
  <!-- Boot -> Idle -->
  <path d="M 360,210 L 500,210" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="200" font-size="9" fill="#94a3b8" text-anchor="middle">boot.complete</text>

  <!-- Idle -> Ingress -->
  <path d="M 780,210 L 950,210" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="860" y="200" font-size="9" fill="#94a3b8" text-anchor="middle">wake.detected</text>

  <!-- Ingress -> Reasoning -->
  <path d="M 1090,270 L 1090,420" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="1100" y="340" font-size="9" fill="#c084fc">text.parsed</text>

  <!-- Reasoning -> Security -->
  <path d="M 950,480 L 780,480" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="860" y="470" font-size="9" fill="#fb7185" text-anchor="middle">plan.requires_tools</text>

  <!-- Security -> Execution -->
  <path d="M 640,540 L 640,630 L 1090,630 L 1090,690" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="860" y="620" font-size="9" fill="#34d399" text-anchor="middle">cleared</text>

  <!-- Execution -> Synthesis -->
  <path d="M 950,750 L 780,750" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="860" y="740" font-size="9" fill="#38bdf8" text-anchor="middle">tool.finished</text>

  <!-- Synthesis -> Idle -->
  <path d="M 500,720 L 440,720 L 440,240 L 500,240" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="480" font-size="9" fill="#94a3b8" text-anchor="middle" transform="rotate(-90, 420, 480)">response.delivered</text>

  <!-- Idle -> Sleep Guard -->
  <path d="M 500,210 L 230,210 L 230,420" stroke="#eab308" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="300" font-size="9" fill="#fde047" text-anchor="middle">inactivity.timeout</text>

  <!-- Sleep Guard -> Idle -->
  <path d="M 260,420 L 260,240 L 500,240" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="270" y="340" font-size="9" fill="#38bdf8">user.wakeup</text>
</svg>
